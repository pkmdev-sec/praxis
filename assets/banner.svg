<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuit" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0 30 L 20 30 M 30 0 L 30 20 M 40 30 L 60 30 M 30 40 L 30 60" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.08"/>
      <circle cx="30" cy="30" r="2" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="#000000"/>
  <rect width="1500" height="500" fill="url(#circuit)"/>
  <rect y="0" width="1500" height="2" fill="url(#accentGrad)" opacity="0.8"/>
  <rect y="498" width="1500" height="2" fill="url(#accentGrad)" opacity="0.4"/>
  <!-- Brain-circuit logo -->
  <g transform="translate(750, 190)" filter="url(#glow)">
    <!-- Brain outline left hemisphere -->
    <path d="M-5,-35 C-25,-35 -35,-25 -35,-5 C-35,10 -28,25 -15,35 C-10,38 -5,40 0,40" fill="none" stroke="url(#brainGrad)" stroke-width="2" opacity="0.8"/>
    <!-- Brain outline right hemisphere -->
    <path d="M5,-35 C25,-35 35,-25 35,-5 C35,10 28,25 15,35 C10,38 5,40 0,40" fill="none" stroke="url(#brainGrad)" stroke-width="2" opacity="0.8"/>
    <!-- Brain folds -->
    <path d="M0,-35 L0,40" fill="none" stroke="url(#brainGrad)" stroke-width="1" opacity="0.4"/>
    <path d="M-25,-15 C-15,-10 -5,-15 0,-10 C5,-15 15,-10 25,-15" fill="none" stroke="url(#brainGrad)" stroke-width="1" opacity="0.4"/>
    <path d="M-20,10 C-10,15 -5,10 0,15 C5,10 10,15 20,10" fill="none" stroke="url(#brainGrad)" stroke-width="1" opacity="0.4"/>
    <!-- Circuit traces extending from brain -->
    <g opacity="0.5">
      <line x1="-35" y1="-5" x2="-55" y2="-5" stroke="#f59e0b" stroke-width="1"/>
      <line x1="-55" y1="-5" x2="-55" y2="-20" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="-55" cy="-20" r="2.5" fill="none" stroke="#f59e0b" stroke-width="1"/>
      <line x1="35" y1="-5" x2="55" y2="-5" stroke="#4338ca" stroke-width="1"/>
      <line x1="55" y1="-5" x2="55" y2="-20" stroke="#4338ca" stroke-width="1"/>
      <circle cx="55" cy="-20" r="2.5" fill="none" stroke="#4338ca" stroke-width="1"/>
      <line x1="-25" y1="-30" x2="-40" y2="-40" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="-40" cy="-40" r="2" fill="none" stroke="#f59e0b" stroke-width="1"/>
      <line x1="25" y1="-30" x2="40" y2="-40" stroke="#4338ca" stroke-width="1"/>
      <circle cx="40" cy="-40" r="2" fill="none" stroke="#4338ca" stroke-width="1"/>
    </g>
  </g>
  <!-- Title -->
  <text x="750" y="290" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="18" fill="url(#accentGrad)" filter="url(#glow)">PRAXIS</text>
  <!-- Subtitle -->
  <text x="750" y="330" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="300" letter-spacing="6" fill="#f59e0b" opacity="0.7">THINKING TOKEN BUDGET OPTIMIZER</text>
  <!-- Decorative line -->
  <rect x="600" y="345" width="300" height="1" fill="url(#glowGrad)"/>
  <!-- Bottom tagline -->
  <text x="750" y="420" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="3" fill="#555555">OPTIMIZING THOUGHT INTO ACTION</text>
</svg>